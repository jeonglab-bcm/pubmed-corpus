[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmed-corpus"
version = "0.1.0"
description = "Build a reproducible disease literature corpus from seed papers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pubmed-corpus = "pubmed_corpus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: calls a live external API (skipped unless PUBMED_CORPUS_NETWORK=1)"]
addopts = "-q"
