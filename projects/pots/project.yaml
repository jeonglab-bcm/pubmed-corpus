screening:
  criteria: 'The disease is postural orthostatic tachycardia syndrome (POTS). Include a paper if its own
    data or argument bears on POTS: its mechanisms, diagnostic tests, subtypes, comorbidities, triggers,
    treatments or outcomes. This includes papers on orthostatic intolerance, autonomic testing or a comorbid
    condition when the title or abstract relates them to POTS or reports patients with chronic orthostatic
    tachycardia or intolerance. Exclude papers about other conditions with no stated link to POTS or orthostatic
    intolerance, and generic methods papers (software, survey instruments, statistics) cited only as tools.'
  auto_include_wordings: []
exclude_retracted: true
references:
- name: POTS-phenotyping corpus (2026-10-01)
  path: reference/pots_phenotyping_2026-10-01.txt
  description: The 2,668-paper corpus of jeonglab-bcm/POTS-phenotyping, retrieved by a hand-written 7-clause
    query that includes historical names (neurocirculatory asthenia, soldier's heart, irritable heart,
    Da Costa syndrome). The benchmark here is how much of it a query drafted only from MeSH and the seeds
    recovers, with no hand-added clauses.
benchmark_note: Seeds are the six PubMed-indexed seed papers of POTS-phenotyping; larsen2025 is a medRxiv
  preprint with no PMID and is left out.
